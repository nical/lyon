[package]
name = "lyon_offset"
version = "0.1.0"
description = "Path offsetting and stroke-to-fill conversion."
authors = ["Nicolas Silva <nical@fastmail.com>"]
repository = "https://github.com/nical/lyon"
documentation = "https://docs.rs/lyon_offset/"
license = "MIT OR Apache-2.0"
edition = "2024"
workspace = "../.."

[features]
serialization = ["serde", "lyon_path/serialization"]
default = ["std"]
std = ["lyon_geom/std", "lyon_path/std", "num-traits/std"]

[dependencies]
lyon_geom = { version = "1.0.20", path = "../geom", default-features = false }
lyon_path = { version = "1.0.19", path = "../path", default-features = false }
num-traits = { version = "0.2.15", default-features = false, features = ["libm"] }
serde = { version = "1.0", optional = true, features = ["serde_derive"], default-features = false }
